<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zelfservice</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#111}.wrap{max-width:960px;margin:auto;background:#fff;min-height:100vh}header{padding:20px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff}.restaurant{font-weight:700;font-size:22px}nav{display:flex;gap:18px;margin-top:12px}nav button{background:none;border:0;font:inherit;cursor:pointer}main{padding:24px 20px 110px}.center{padding:70px 10px;text-align:center}h1{font-size:30px}.debug{white-space:pre-wrap;text-align:left;max-width:760px;margin:20px auto;padding:12px;background:#fafafa;border:1px dashed #bbb;border-radius:10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}button.table,button.product{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;cursor:pointer;text-align:left}.table strong{display:block;font-size:18px}.table span{color:#777}.product{width:100%;display:flex;justify-content:space-between;margin:8px 0}.empty{padding:30px;text-align:center;border:1px dashed #bbb;border-radius:12px;color:#666}.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}.btn{background:#111;color:#fff;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}.secondary{background:#eee;color:#111}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end}.panel{width:min(700px,100%);background:#fff;border-radius:20px 20px 0 0;padding:22px;max-height:80vh;overflow:auto}.cartrow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}[hidden]{display:none!important}
</style><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script></head><body><div class="wrap"><header><div class="restaurant" id="restaurant">Zelfservice</div><nav><button id="tablesNav">Tafel</button><span>→</span><button id="menuNav">Menu</button></nav></header><main>
<section id="loading"><div class="center"><h1 id="statusTitle">Een moment…</h1><p id="statusText">Restaurant en menu worden geladen.</p><pre class="debug" id="debug" hidden></pre></div></section>
<section id="tablesStep" hidden><h1>Waar zit je?</h1><p>Kies je tafel.</p><div class="grid" id="tables"></div></section>
<section id="menuStep" hidden><h1>Menu</h1><p>Gekozen: <strong id="chosen">geen tafel</strong></p><div id="products"></div></section>
<section id="doneStep" hidden><div class="center"><h1>Bestelling geplaatst</h1><p id="doneText"></p><button class="btn" id="new">Nieuwe bestelling</button></div></section>
</main></div><div class="bar" id="cartBar" hidden><span><b id="count">0</b> items • <b id="total">€ 0,00</b></span><button class="btn" id="cartOpen">Bekijk bestelling</button></div><div class="modal" id="cart" hidden><div class="panel"><h2>Bestelling</h2><div id="cartItems"></div><button class="btn" id="place">Bestelling plaatsen</button> <button class="btn secondary" id="cartClose">Sluiten</button></div></div><script>
const firebaseConfig={apiKey:"AIzaSyBVwx6eUdSkebGIK2J_NDwOD3rxTcIg1v4",authDomain:"restaurant-het-goedkoop.firebaseapp.com",databaseURL:"https://restaurant-het-goedkoop-default-rtdb.europe-west1.firebasedatabase.app",projectId:"restaurant-het-goedkoop",storageBucket:"restaurant-het-goedkoop.firebasestorage.app",messagingSenderId:"262921210117",appId:"1:262921210117:web:4158692d91fd580cda4f6c"};
const $=id=>document.getElementById(id);
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
const euro=v=>'€ '+(Number(v)||0).toFixed(2).replace('.',',');
const entries=v=>Array.isArray(v)?v.map((x,i)=>({id:String(i),...(x&&typeof x==='object'?x:{value:x})})):v&&typeof v==='object'?Object.entries(v).map(([id,x])=>({id,...(x&&typeof x==='object'?x:{value:x})})):[];
const st={key:null,code:null,restaurant:null,layout:{},products:{},table:null,cart:[],ordersPath:null};

function getCode(){
  const u=new URL(location.href);
  for(const k of ['selfservicecode','selfServiceCode','selfserviceCode','code','joinCode','joincode']){
    const v=u.searchParams.get(k); if(/^\d{5}$/.test(v||'')) return v;
  }
  for(const s of [u.pathname,u.hash]){const m=String(s).match(/(?<!\d)(\d{5})(?!\d)/);if(m)return m[1]}
  return '';
}
function show(x){for(const id of ['loading','tablesStep','menuStep','doneStep'])$(id).hidden=id!==x}
function status(a,b,c=''){ $('statusTitle').textContent=a;$('statusText').textContent=b;$('debug').textContent=c;$('debug').hidden=!c }

function tableLabel(t){
  const raw=t.label??t.name??t.naam??t.number??t.nummer??t.tableNumber??t.id??'';
  const s=String(raw);
  if(/^tafel\b/i.test(s)||/^table\b/i.test(s))return s;
  if(t.number!==undefined&&t.number!==null&&t.number!=='')return 'Tafel '+t.number;
  if(/^\d+$/.test(s))return 'Tafel '+s;
  return s||'Tafel';
}
function isTable(t){
  const k=String(t.kind??t.type??t.soort??'').toLowerCase(), n=String(t.id??t.name??t.label??t.naam??'').toLowerCase();
  return k==='tafel'||k==='table'||/^tafel\s*\d+/i.test(n)||/^table\s*\d+/i.test(n)||t.number!==undefined;
}
function isBank(t){
  const k=String(t.kind??t.type??t.soort??'').toLowerCase(), n=String(t.id??t.name??t.label??t.naam??'').toLowerCase();
  return k==='bank'||k==='bench'||/^bank\s*\d+/i.test(n)||/^bench\s*\d+/i.test(n);
}
function productLabel(p){return p.naam??p.name??p.title??p.label??p.productName??p.id??'Product'}
function price(p){return Number(p.prijs??p.price??p.amount??p.cost??0)||0}

function looksLikeRestaurantObject(o, code){
  if(!o||typeof o!=='object')return false;
  const vals=[o.selfservicecode,o.selfServiceCode,o.selfserviceCode,o.selfServicecode,o.code,o.joinCode,o.joincode,o.selfservice?.code,o.selfService?.code];
  return vals.some(v=>String(v??'').replace(/\D/g,'')===code);
}
function looksLikeTableMap(o){
  if(!o||typeof o!=='object')return false;
  const a=entries(o); return a.some(x=>x&&typeof x==='object'&&(isTable(x)||isBank(x)));
}
function pickRestaurantConfig(root, code){
  if(looksLikeRestaurantObject(root,code)) return {key:null,data:root};
  for(const [key,val] of Object.entries(root||{})){
    if(looksLikeRestaurantObject(val,code)) return {key,data:val};
  }
  return null;
}
async function readAny(path){
  try{return (await firebase.database().ref(path).once('value')).val()}catch(e){return null}
}
async function findRestaurant(code){
  // Nieuwe structuur: restaurant-selfserviceconfig
  const cfg=await readAny('restaurant-selfserviceconfig');
  const hit=pickRestaurantConfig(cfg,code);
  if(hit) return {id:hit.key||hit.data.id||hit.data.restaurantId||hit.data.restaurantID||null,data:hit.data,source:'restaurant-selfserviceconfig'};
  // Ook ondersteunen wanneer restaurant-selfserviceconfig per code als key gebruikt wordt.
  if(cfg&&typeof cfg==='object'&&cfg[code]) return {id:cfg[code].restaurantId||cfg[code].id||code,data:cfg[code],source:'restaurant-selfserviceconfig'};
  // Oude structuur fallback
  const old=await readAny('restaurants');
  const oldHit=pickRestaurantConfig(old,code);
  if(oldHit) return {id:oldHit.key||oldHit.data.id||oldHit.data.restaurantId||null,data:oldHit.data,source:'restaurants'};
  return null;
}
function candidateKey(st){
  return [st.key,st.restaurant?.id,st.restaurant?.restaurantId,st.restaurant?.restaurantID,st.restaurant?.slug,st.restaurant?.naam,st.restaurant?.name].filter(v=>v!==null&&v!==undefined).map(String);
}
function findNestedForKeys(root, keys){
  if(!root||typeof root!=='object')return null;
  const lower=new Set(keys.map(x=>String(x).toLowerCase()));
  for(const [k,v] of Object.entries(root)) if(lower.has(String(k).toLowerCase())) return v;
  // Search one additional object level for a matching restaurant key/id.
  for(const [k,v] of Object.entries(root)){
    if(v&&typeof v==='object'){
      for(const key of keys) if(String(v.restaurantId??v.restaurantID??v.id??'').toLowerCase()===String(key).toLowerCase()) return v;
    }
  }
  return null;
}
async function loadBranch(baseName, fallbackNames=[]){
  const names=[baseName,...fallbackNames];
  for(const name of names){
    const root=await readAny(name); if(root==null)continue;
    const nested=findNestedForKeys(root,candidateKey(st));
    if(nested!=null)return nested;
    // If this branch itself is already the restaurant payload, use it.
    if(looksLikeTableMap(root) || entries(root).some(x=>x&&typeof x==='object'&&(x.price!==undefined||x.prijs!==undefined||x.name!==undefined||x.naam!==undefined))) return root;
  }
  return {};
}
function extractLayout(root){
  if(!root||typeof root!=='object')return {};
  // Common shapes: branch/{restaurant}/plattegrond or direct tables/banks.
  for(const k of ['plattegrond','floorplan','tables','tafels']) if(root[k]&&typeof root[k]==='object') return root[k];
  if(root.tables&&typeof root.tables==='object')return root.tables;
  return root;
}
function extractProducts(root){
  if(!root||typeof root!=='object')return {};
  for(const k of ['producten','products','menu','items']) if(root[k]&&typeof root[k]==='object')return root[k];
  return root;
}
function renderFloorplan(){
  const g=$('tables'); g.innerHTML='';
  const all=entries(st.layout).filter(x=>x&&typeof x==='object');
  const banks=all.filter(isBank), tables=all.filter(isTable).sort((a,b)=>{
    const an=Number(a.number??String(a.id).match(/\d+/)?.[0]||99999), bn=Number(b.number??String(b.id).match(/\d+/)?.[0]||99999); return an-bn;
  });
  const head=document.createElement('div');head.className='empty';head.style.marginBottom='14px';head.innerHTML=`Plattegrond geladen: <strong>${tables.length}</strong> tafels en <strong>${banks.length}</strong> banken`;g.appendChild(head);
  if(!tables.length){g.innerHTML+='<div class="empty">Geen tafels gevonden in restaurant-selfserviceconfig-plattegrond.</div>';return}
  for(const t of tables){const b=document.createElement('button');b.className='table';b.innerHTML='<strong>'+esc(tableLabel(t))+'</strong><span>'+esc(t.shape??t.vorm??'')+'</span>';b.onclick=()=>{st.table=t;$('chosen').textContent=tableLabel(t);renderProducts();show('menuStep')};g.appendChild(b)}
}
function renderProducts(){
  const w=$('products');w.innerHTML='';
  const a=entries(st.products).filter(p=>p&&typeof p==='object').filter(p=>p.actief!==false&&p.active!==false&&p.disabled!==true&&p.hidden!==true);
  if(!a.length){w.innerHTML='<div class="empty">Geen producten gevonden in restaurant-selfserviceconfig-producten.</div>';return}
  const gs={};for(const p of a){const c=p.categorie??p.category??p.group??'Menu';(gs[c]??=[]).push(p)}
  for(const [cat,items] of Object.entries(gs)){const h=document.createElement('h2');h.textContent=cat;w.appendChild(h);for(const p of items){const b=document.createElement('button');b.className='product';b.innerHTML='<span><strong>'+esc(productLabel(p))+'</strong></span><b>'+euro(price(p))+'</b>';b.onclick=()=>{const ex=st.cart.find(x=>x.id===p.id);if(ex)ex.q++;else st.cart.push({id:p.id,n:productLabel(p),p:price(p),q:1});updateCart()};w.appendChild(b)}}
}
function updateCart(){const n=st.cart.reduce((s,x)=>s+x.q,0),t=st.cart.reduce((s,x)=>s+x.p*x.q,0);$('count').textContent=n;$('total').textContent=euro(t);$('cartBar').hidden=!n}
function openCart(){const w=$('cartItems');w.innerHTML='';st.cart.forEach((x,i)=>{const r=document.createElement('div');r.className='cartrow';r.innerHTML='<span>'+x.q+'× '+esc(x.n)+'</span><button>−</button>';r.querySelector('button').onclick=()=>{x.q--;if(x.q<=0)st.cart.splice(i,1);openCart();updateCart()};w.appendChild(r)});$('cart').hidden=false}
async function placeOrder(){if(!st.table||!st.cart.length)return;const total=st.cart.reduce((s,x)=>s+x.p*x.q,0);const order={tableId:st.table.id,tableNumber:st.table.number??null,items:st.cart.map(x=>({productId:x.id,name:x.n,price:x.p,quantity:x.q})),total,status:'nieuw',createdAt:firebase.database.ServerValue.TIMESTAMP};const path=st.ordersPath||('restaurant-selfserviceconfig-bestellingen/'+(st.key||'orders'));await firebase.database().ref(path).push(order);st.cart=[];updateCart();$('cart').hidden=true;$('doneText').textContent='Bestelling geplaatst voor '+tableLabel(st.table)+'.';show('doneStep')}
async function boot(){
  try{
    firebase.initializeApp(firebaseConfig);
    st.code=getCode();
    if(!st.code){status('Geen selfservicecode','Open de QR-link van het restaurant.','Geen 5-cijferige code gevonden in de URL.');return}
    $('statusText').textContent='Restaurant zoeken met code '+st.code+'…';
    const f=await findRestaurant(st.code);
    if(!f){status('Restaurant niet gevonden','Geen configuratie gevonden met code '+st.code,'Gezocht in restaurant-selfserviceconfig en als fallback restaurants.');return}
    st.key=f.id;st.restaurant=f.data||{};$('restaurant').textContent=st.restaurant.naam||st.restaurant.name||st.restaurant.restaurantName||'Zelfservice';

    // Nieuwe expliciete database-tabs/roots.
    const layoutRaw=await loadBranch('restaurant-selfserviceconfig-plattegrond',['restaurant-selfserviceconfig-plattegrond/'+(st.key||''),'restaurants/'+(st.key||'')+'/plattegrond']);
    const productsRaw=await loadBranch('restaurant-selfserviceconfig-producten',['restaurant-selfserviceconfig-producten/'+(st.key||''),'restaurants/'+(st.key||'')+'/producten']);
    st.layout=extractLayout(layoutRaw);st.products=extractProducts(productsRaw);
    st.ordersPath=st.key?('restaurant-selfserviceconfig-bestellingen/'+st.key):'restaurant-selfserviceconfig-bestellingen';
    renderFloorplan();renderProducts();show('tablesStep');

    const layoutRef=st.key?firebase.database().ref('restaurant-selfserviceconfig-plattegrond/'+st.key):firebase.database().ref('restaurant-selfserviceconfig-plattegrond');
    const productRef=st.key?firebase.database().ref('restaurant-selfserviceconfig-producten/'+st.key):firebase.database().ref('restaurant-selfserviceconfig-producten');
    layoutRef.on('value',s=>{if(s.val()!=null){st.layout=extractLayout(s.val());renderFloorplan()}});
    productRef.on('value',s=>{if(s.val()!=null){st.products=extractProducts(s.val());renderProducts()}});
  }catch(e){console.error(e);status('Zelfservice kan niet starten','Firebase kon niet worden geladen of gelezen.',String(e?.stack||e))}
}
document.addEventListener('DOMContentLoaded',()=>{$('tablesNav').onclick=()=>show('tablesStep');$('menuNav').onclick=()=>{if(st.table)show('menuStep')};$('cartOpen').onclick=openCart;$('cartClose').onclick=()=>$('cart').hidden=true;$('place').onclick=()=>placeOrder().catch(e=>alert('Bestelling mislukt: '+e.message));$('new').onclick=()=>show('tablesStep');boot()});
</script></body></html>
