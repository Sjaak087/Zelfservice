<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Zelfservice</title>
  
  <style>
    .diagnostiek{margin-top:18px;padding:12px 14px;border:1px dashed var(--lijn-sterk);border-radius:8px;color:var(--room-zacht);font-size:.8rem;white-space:pre-wrap;word-break:break-word}
    .verborgen{display:none!important}
    .fout-actie{margin-top:18px}
    .route-knop{background:none;border:0;padding:0;color:var(--room-zacht);font:inherit;cursor:pointer}
    .route-knop:disabled{opacity:.45;cursor:default}
  </style>
</head>
<body>
<main class="scherm">
  <header class="kop">
    <div class="kop-boven"><div class="restaurant-naam" id="restaurant-naam">Zelfservice</div></div>
    <div class="route">
      <button class="route-knop actief" data-stap="tafel">Tafel</button><span class="scheiding">→</span>
      <button class="route-knop" data-stap="menu" disabled>Menu</button><span class="scheiding">→</span>
      <button class="route-knop" data-stap="klaar" disabled>Besteld</button>
    </div>
  </header>

  <div class="inhoud">
    <div class="centreer-scherm" id="laad-scherm">
      <h1 class="titel" id="status-titel">Een moment…</h1>
      <p id="status-tekst">Restaurantgegevens worden geladen.</p>
      <div class="diagnostiek verborgen" id="diagnostiek"></div>
    </div>

    <section id="stap-tafel" class="verborgen">
      <h1 class="titel stap-titel">Waar zit je?</h1>
      <div class="tafel-grid" id="tafel-grid"></div>
    </section>

    <section id="stap-menu" class="verborgen">
      <div id="menu-lijst"></div>
    </section>

    <section id="stap-klaar" class="verborgen">
      <div class="centreer-scherm">
        <div class="vink">✓</div>
        <h1 class="titel">Bestelling geplaatst</h1>
        <p id="klaar-tekst"></p>
        <button class="hoofd-knop" id="nieuwe-bestelling-knop" style="max-width:280px">Nog iets bestellen</button>
      </div>
    </section>
  </div>

  <div class="mandje-balk verborgen" id="mandje-balk">
    <div class="mandje-info"><span class="mandje-aantal" id="mandje-aantal">0 items</span><span class="mandje-totaal" id="mandje-totaal">€ 0,00</span></div>
    <button class="hoofd-knop" id="mandje-openen-knop">Bekijk bestelling</button>
  </div>
</main>

<div class="overlay verborgen" id="product-overlay">
  <div class="modaal">
    <div class="grip"></div>
    <div class="modaal-kop"><div><div class="product-naam modaal-titel" id="modaal-naam"></div><div class="product-prijs" id="modaal-prijs"></div></div><button class="sluit-knop" id="modaal-sluiten">×</button></div>
    <div id="modaal-preset-blok" class="verborgen"><label class="veld-label">Opmerking</label><div class="chip-rij" id="modaal-preset-chips"></div></div>
    <label class="veld-label" for="modaal-opmerking-vrij">Eigen opmerking (optioneel)</label>
    <textarea class="opmerking-veld" id="modaal-opmerking-vrij" placeholder="Bijv. allergie, extra verzoek..."></textarea>
    <div class="aantal-rij"><button class="aantal-knop" id="modaal-min">−</button><span class="aantal-getal" id="modaal-aantal">1</span><button class="aantal-knop" id="modaal-plus">+</button></div>
    <button class="hoofd-knop" id="modaal-toevoegen">Toevoegen aan bestelling</button>
  </div>
</div>

<div class="overlay verborgen" id="mandje-overlay">
  <div class="modaal">
    <div class="grip"></div>
    <div class="modaal-kop"><div class="product-naam modaal-titel">Jouw bestelling</div><button class="sluit-knop" id="mandje-sluiten">×</button></div>
    <div id="mandje-items"></div>
    <div class="totaal-rij"><span>Totaal</span><span id="mandje-modaal-totaal">€ 0,00</span></div>
    <button class="hoofd-knop" id="bestelling-plaatsen-knop">Bestelling plaatsen</button>
    <button class="tekst-knop" id="mandje-verder-knop">Verder bestellen</button>
  </div>
</div>

<script>
(function(){
  function appBase(){
    var p=location.pathname.split('/').filter(Boolean);
    if (location.hostname.endsWith('.github.io')) return p.length ? '/' + p[0] + '/' : '/';
    if (p.length>=2 && /^\d{5}$/.test(p[p.length-1])) return '/' + p[0] + '/';
    if (p.length>=2 && p[p.length-1]==='') return p.length>1 ? '/' + p[0] + '/' : '/';
    return p.length>=2 && !/\.[a-z0-9]+$/i.test(p[p.length-1]) ? '/' + p[0] + '/' : '/';
  }
  var base=appBase(); window.APP_BASE=base;
  function add(tag,attrs){ var el=document.createElement(tag); Object.keys(attrs).forEach(function(k){el.setAttribute(k,attrs[k]);}); document.head.appendChild(el); return el; }
  add('link',{rel:'stylesheet',href:base+'css/style.css'});
  window.__loadScript=function(src){ return new Promise(function(resolve,reject){ var s=document.createElement('script'); s.src=base+src; s.onload=resolve; s.onerror=function(){reject(new Error('Kon script niet laden: '+base+src));}; document.head.appendChild(s); }); };
  window.addEventListener('error',function(e){ var box=document.getElementById('diagnostiek')||document.getElementById('debug'); if(box){box.classList.remove('verborgen'); box.textContent='Fout: '+(e.error&&e.error.stack||e.message||'Onbekende fout');} });
})();
</script>
<script>
(async function(){
  try {
    await __loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js');
    await __loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js');
    await __loadScript('js/firebase-config.js');
    await __loadScript('js/common.js');
    await __loadScript('js/zelfservice.js');
  } catch(e) {
    var t=document.getElementById('status-titel'), p=document.getElementById('status-tekst'), d=document.getElementById('diagnostiek');
    if(t) t.textContent='Zelfservice kan niet starten';
    if(p) p.textContent='Een bestand of Firebase-script kon niet worden geladen.';
    if(d){d.classList.remove('verborgen'); d.textContent=String(e&&e.stack||e);}
  }
})();
</script>
</body></html>
