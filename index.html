<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zelfservice</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#111}.wrap{max-width:960px;margin:auto;background:#fff;min-height:100vh}header{padding:20px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff}.restaurant{font-weight:700;font-size:22px}nav{display:flex;gap:18px;margin-top:12px}nav button{background:none;border:0;font:inherit;cursor:pointer}main{padding:24px 20px 110px}.center{padding:70px 10px;text-align:center}h1{font-size:30px}.debug{white-space:pre-wrap;text-align:left;max-width:760px;margin:20px auto;padding:12px;background:#fafafa;border:1px dashed #bbb;border-radius:10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}button.table,button.product{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;cursor:pointer;text-align:left}.table strong{display:block;font-size:18px}.table span{color:#777}.product{width:100%;display:flex;justify-content:space-between;margin:8px 0}.empty{padding:30px;text-align:center;border:1px dashed #bbb;border-radius:12px;color:#666}.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}.btn{background:#111;color:#fff;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}.secondary{background:#eee;color:#111}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end}.panel{width:min(700px,100%);background:#fff;border-radius:20px 20px 0 0;padding:22px;max-height:80vh;overflow:auto}.cartrow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}[hidden]{display:none!important}
</style><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script></head><body><div class="wrap"><header><div class="restaurant" id="restaurant">Zelfservice</div><nav><button id="tablesNav">Tafel</button><span>→</span><button id="menuNav">Menu</button></nav></header><main>
<section id="loading"><div class="center"><h1 id="statusTitle">Een moment…</h1><p id="statusText">Restaurant en menu worden geladen.</p><pre class="debug" id="debug" hidden></pre></div></section>
<section id="tablesStep" hidden><h1>Waar zit je?</h1><p>Kies je tafel.</p><div class="grid" id="tables"></div></section>
<section id="menuStep" hidden><h1>Menu</h1><p>Gekozen: <strong id="chosen">geen tafel</strong></p><div id="products"></div></section>
<section id="doneStep" hidden><div class="center"><h1>Bestelling geplaatst</h1><p id="doneText"></p><button class="btn" id="new">Nieuwe bestelling</button></div></section>
</main></div><div class="bar" id="cartBar" hidden><span><b id="count">0</b> items • <b id="total">€ 0,00</b></span><button class="btn" id="cartOpen">Bekijk bestelling</button></div><div class="modal" id="cart" hidden><div class="panel"><h2>Bestelling</h2><div id="cartItems"></div><button class="btn" id="place">Bestelling plaatsen</button> <button class="btn secondary" id="cartClose">Sluiten</button></div></div><script>
const firebaseConfig={apiKey:"AIzaSyBVwx6eUdSkebGIK2J_NDwOD3rxTcIg1v4",authDomain:"restaurant-het-goedkoop.firebaseapp.com",databaseURL:"https://restaurant-het-goedkoop-default-rtdb.europe-west1.firebasedatabase.app",projectId:"restaurant-het-goedkoop",storageBucket:"restaurant-het-goedkoop.firebasestorage.app",messagingSenderId:"262921210117",appId:"1:262921210117:web:4158692d91fd580cda4f6c"};
const $=id=>document.getElementById(id);
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
const euro=v=>'€ '+(Number(v)||0).toFixed(2).replace('.',',');
const entries=v=>Array.isArray(v)?v.map((x,i)=>({id:String(i),...(x&&typeof x==='object'?x:{value:x})})):v&&typeof v==='object'?Object.entries(v).map(([id,x])=>({id,...(x&&typeof x==='object'?x:{value:x})}))[];
const st={id:null,code:null,restaurant:null,tables:{},products:{},table:null,cart:[]};
function code(){const u=new URL(location.href);for(const k of ['selfservicecode','selfServiceCode','code','joinCode','joincode']){const v=u.searchParams.get(k);if(/^\d{5}$/.test(v||''))return v}for(const s of [...u.pathname.split('/'),u.search,u.hash]){const m=String(s).match(/(?<!\d)(\d{5})(?!\d)/);if(m)return m[1]}return''}
function show(x){for(const id of ['loading','tablesStep','menuStep','doneStep'])$(id).hidden=id!==x}
function status(a,b,c=''){ $('statusTitle').textContent=a;$('statusText').textContent=b;$('debug').textContent=c;$('debug').hidden=!c }
function tableLabel(t){const n=t.number??t.nummer??t.tableNumber??t.label??t.name??t.naam;return n!==undefined&&n!==null&&n!==''?(String(n).toLowerCase().startsWith('tafel')?String(n):'Tafel '+n):'Tafel'}
function productLabel(p){return p.naam??p.name??p.title??p.label??'Product'}
function price(p){return Number(p.prijs??p.price??p.amount??0)||0}
async function findRestaurant(c){const snap=await firebase.database().ref('restaurants').once('value');const all=snap.val()||{};for(const [id,r] of Object.entries(all)){if(!r||typeof r!=='object')continue;const vals=[r.selfservicecode,r.selfServiceCode,r.selfserviceCode,r.selfServicecode,r.self_service_code];if(vals.some(v=>String(v??'').trim()===c||String(v??'').replace(/\D/g,'')===c))return{id,data:r}}return null}
function renderTables(){const g=$('tables');g.innerHTML='';const a=entries(st.tables).filter(t=>t&&typeof t==='object'&&String(t.kind??t.type??'').toLowerCase()==='tafel').sort((a,b)=>(Number(a.number)||99999)-(Number(b.number)||99999));if(!a.length){g.innerHTML='<div class="empty">Geen tafels gevonden.<br><small>restaurants/'+esc(st.id)+'/floorplan/tables</small></div>';return}for(const t of a){const b=document.createElement('button');b.className='table';b.innerHTML='<strong>'+esc(tableLabel(t))+'</strong><span>'+esc(t.shape||'')+'</span>';b.onclick=()=>{st.table=t;$('chosen').textContent=tableLabel(t);renderProducts();show('menuStep')};g.appendChild(b)}}
function renderProducts(){const w=$('products');w.innerHTML='';const a=entries(st.products).filter(p=>p&&typeof p==='object').filter(p=>p.actief!==false&&p.active!==false&&p.disabled!==true&&p.hidden!==true);if(!a.length){w.innerHTML='<div class="empty">Geen producten gevonden.<br><small>restaurants/'+esc(st.id)+'/products</small></div>';return}const gs={};for(const p of a){const c=p.categorie??p.category??p.group??'Menu';(gs[c]??=[]).push(p)}for(const [cat,items] of Object.entries(gs)){const h=document.createElement('h2');h.textContent=cat;w.appendChild(h);for(const p of items){const b=document.createElement('button');b.className='product';b.innerHTML='<span><strong>'+esc(productLabel(p))+'</strong></span><b>'+euro(price(p))+'</b>';b.onclick=()=>{const ex=st.cart.find(x=>x.id===p.id);if(ex)ex.q++;else st.cart.push({id:p.id,n:productLabel(p),p:price(p),q:1});updateCart()};w.appendChild(b)}}}
function updateCart(){const n=st.cart.reduce((s,x)=>s+x.q,0),t=st.cart.reduce((s,x)=>s+x.p*x.q,0);$('count').textContent=n;$('total').textContent=euro(t);$('cartBar').hidden=!n}
function openCart(){const w=$('cartItems');w.innerHTML='';st.cart.forEach((x,i)=>{const r=document.createElement('div');r.className='cartrow';r.innerHTML='<span>'+x.q+'× '+esc(x.n)+'</span><button>−</button>';r.querySelector('button').onclick=()=>{x.q--;if(x.q<=0)st.cart.splice(i,1);openCart();updateCart()};w.appendChild(r)});$('cart').hidden=false}
async function placeOrder(){if(!st.table||!st.cart.length)return;const total=st.cart.reduce((s,x)=>s+x.p*x.q,0);const order={tableId:st.table.id,tableNumber:st.table.number??null,items:st.cart.map(x=>({productId:x.id,name:x.n,price:x.p,quantity:x.q})),total,status:'nieuw',createdAt:firebase.database.ServerValue.TIMESTAMP};await firebase.database().ref('restaurants/'+st.id+'/bestellingen').push(order);st.cart=[];updateCart();$('cart').hidden=true;$('doneText').textContent='Bestelling geplaatst voor '+tableLabel(st.table)+'.';show('doneStep')}
async function boot(){try{firebase.initializeApp(firebaseConfig);st.code=code();if(!st.code){status('Geen selfservicecode','Open de QR-link van het restaurant.','Geen 5-cijferige code gevonden in de URL.');return}$('statusText').textContent='Restaurant zoeken met code '+st.code+'…';const f=await findRestaurant(st.code);if(!f){status('Restaurant niet gevonden','Geen restaurant gevonden met code '+st.code,'Controleer restaurants/*/selfservicecode.');return}st.id=f.id;st.restaurant=f.data;$('restaurant').textContent=st.restaurant.naam||st.restaurant.name||'Zelfservice';const base=firebase.database().ref('restaurants/'+st.id);const [ts,ps]=await Promise.all([base.child('floorplan/tables').once('value'),base.child('products').once('value')]);st.tables=ts.val()||{};st.products=ps.val()||{};renderTables();renderProducts();show('tablesStep');base.child('floorplan/tables').on('value',s=>{st.tables=s.val()||{};renderTables()});base.child('products').on('value',s=>{st.products=s.val()||{};renderProducts()})}catch(e){console.error(e);status('Zelfservice kan niet starten','Firebase kon niet worden geladen of gelezen.',String(e?.stack||e))}}
document.addEventListener('DOMContentLoaded',()=>{ $('tablesNav').onclick=()=>show('tablesStep');$('menuNav').onclick=()=>{if(st.table)show('menuStep')};$('cartOpen').onclick=openCart;$('cartClose').onclick=()=>$('cart').hidden=true;$('place').onclick=()=>placeOrder().catch(e=>alert('Bestelling mislukt: '+e.message));$('new').onclick=()=>show('tablesStep');boot()});
</script></body></html>
